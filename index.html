<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配色方案批量生成器</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;background:#f3f4f6;color:#222}
header{padding:14px 20px;background:#fff;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0}
label{display:flex;align-items:center;gap:6px;white-space:nowrap}
select,input[type=number],button,textarea{font:inherit}
select,input[type=number]{padding:3px 6px;border:1px solid #bbb;border-radius:4px;background:#fff}
input[type=number]{width:64px}
button{padding:4px 12px;border:1px solid #bbb;border-radius:4px;background:#fff;cursor:pointer}
button:hover{background:#eef}
button.pri{background:#2f6fed;color:#fff;border-color:#2f6fed}
button.pri:hover{background:#1f5cd8}
main{display:flex;flex-wrap:wrap;gap:20px;padding:20px;align-items:flex-start}
.panel{background:#fff;border:1px solid #ddd;border-radius:6px;padding:14px}
.panel h2{font-size:14px;margin:0 0 10px}
#editor{display:grid;grid-template-columns:auto 34px 82px;gap:4px 8px;align-items:center}
#editor input[type=color]{width:34px;height:24px;padding:0;border:1px solid #bbb;background:none}
#editor input[type=text]{width:82px;padding:2px 6px;border:1px solid #bbb;border-radius:4px;font-family:Consolas,monospace}
#editor span{font-family:Consolas,monospace}
#editor small{color:#888;margin-left:4px}
textarea#out{width:210px;height:300px;font-family:Consolas,monospace;font-size:13px;padding:6px;border:1px solid #bbb;border-radius:4px;resize:vertical}
#batchWrap{padding:0 20px 30px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px;cursor:pointer}
.card:hover{border-color:#2f6fed}
.card .cap{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:#666}
.card .cap button{padding:1px 8px;font-size:12px}
.pvbox{overflow:hidden}
/* ===== 预览 ===== */
.pv{width:300px;background:var(--canvas);border:1px solid var(--bd);color:var(--fg);font-size:13px;user-select:none}
.card .pv{zoom:.62}
.pv .hd{display:flex;align-items:center;gap:4px;padding:4px;background:var(--hdbg);border-bottom:1px solid var(--bd)}
.pv .b{padding:2px 14px;border:1px solid var(--bd);color:var(--mu);border-radius:2px;cursor:default}
.pv .b:hover{background:var(--btnhv)}
.pv .b.ac{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.pv .sp{flex:1}
.pv .ic{width:24px;text-align:center;padding:2px 0;border:1px solid transparent;color:var(--mu);border-radius:2px}
.pv .ic:hover{background:var(--btnhv)}
.pv .tt{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-weight:bold;background:var(--hdbg);border-bottom:1px solid var(--bd)}
.pv .tt i{font-style:normal;font-weight:normal;color:var(--mu)}
.pv .list{height:150px;overflow-y:auto;padding:2px 0;background:var(--canvas);scrollbar-color:var(--sb) var(--canvas);scrollbar-width:thin}
.pv .list::-webkit-scrollbar{width:8px}
.pv .list::-webkit-scrollbar-track{background:var(--canvas)}
.pv .list::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}
.pv .row{position:relative;display:flex;align-items:center;gap:6px;padding:4px 8px;margin-bottom:2px;background:var(--bg);overflow:hidden}
.pv .row:nth-child(even){background:var(--zb)}
.pv .row:hover,.pv .row.hov{background:var(--hv)}
.pv .row.sel{background:var(--sel)}
.pv .row.sel *{color:var(--selfg)!important}
.pv .row.drop{background:var(--drop);outline:1px dashed var(--ac);outline-offset:-2px}
.pv .row>*{position:relative;z-index:1}
.pv .row .bar{position:absolute;z-index:0;right:0;top:0;bottom:0;background:var(--bar)}
.pv .row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv .row .sz{color:var(--mu)}
.pv .ft{padding:4px 8px;color:var(--mu);border-top:1px solid var(--bd);background:var(--hdbg)}
</style>
</head>
<body>
<header>
  <h1>配色方案批量生成器</h1>
  <label>模式
    <select id="mode"><option value="rand">随机</option><option value="light">浅色</option><option value="dark">深色</option></select>
  </label>
  <label>强调色关系
    <select id="rel"><option value="rand">随机</option><option value="comp">互补</option><option value="ana">邻近</option><option value="tri">三角</option><option value="mono">同色系</option></select>
  </label>
  <label><input type="checkbox" id="hueRand" checked>随机色相</label>
  <label>色相 <input type="range" id="hue" min="0" max="359" value="200" disabled><span id="hueV">200</span></label>
  <label>数量 <input type="number" id="cnt" min="1" max="60" value="12"></label>
  <button class="pri" id="go">批量生成</button>
  <button id="copyAll">复制全部</button>
  <label><input type="checkbox" id="showDrop">预览拖放态</label>
</header>

<main>
  <div class="panel">
    <h2>预览（点击行可选中）</h2>
    <div id="mainPv"></div>
  </div>
  <div class="panel">
    <h2>微调</h2>
    <div id="editor"></div>
  </div>
  <div class="panel">
    <h2>输出 <button id="copyOne" style="float:right;padding:1px 10px">复制</button></h2>
    <textarea id="out" spellcheck="false"></textarea>
  </div>
</main>

<div id="batchWrap"><div id="cards"></div></div>

<script>
const KEYS=['bg','zb','fg','mu','hv','sel','selfg','bar','drop','ac','acfg','bd','sb','hdbg','btnhv','canvas'];
const LABEL={bg:'奇数行背景',zb:'偶数行斑马',fg:'名称文字',mu:'大小/数量文字',hv:'悬停高亮',sel:'选中行背景',selfg:'选中行文字',bar:'大小背景条',drop:'拖拽放置',ac:'激活按钮底色',acfg:'激活按钮文字',bd:'边框分隔线',sb:'滚动条',hdbg:'表头底色',btnhv:'行内按钮悬停',canvas:'列表画布底色'};
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function hsl(h,s,l){
  h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase();
}

function gen(o){
  const h=o.hueRand?rnd(0,360):o.hue;
  const mode=o.mode==='rand'?pick(['light','dark']):o.mode;
  const rel=o.rel==='rand'?pick(['comp','ana','tri','mono']):o.rel;
  let off={comp:180,ana:pick([-35,35]),tri:pick([120,240]),mono:0}[rel];
  const ah=h+off;
  const j=rnd(.8,1.25);           // 饱和度抖动
  const bs=rnd(18,40)*j;          // 底色饱和度
  const as=rnd(50,75);            // 强调饱和度
  let c;
  if(mode==='light'){
    const L=rnd(95,98);
    c={bg:hsl(h,bs,L),zb:hsl(h,bs,L-3.5),fg:hsl(h,35,rnd(12,18)),mu:hsl(h,15,rnd(40,48)),
       hv:hsl(h,bs+10,L-9),sel:hsl(ah,as-5,rnd(80,86)),selfg:hsl(ah,as,rnd(14,22)),
       bar:hsl(h,bs+15,L-15),drop:hsl(ah,as,rnd(76,82)),ac:hsl(ah,as,rnd(42,50)),acfg:'FFFFFF',
       bd:hsl(h,bs-5,L-14),sb:hsl(h,bs-8,L-24),hdbg:hsl(h,bs,L-6),btnhv:hsl(h,bs+10,L-12)};
  }else{
    const L=rnd(9,14);
    c={bg:hsl(h,bs*.7,L),zb:hsl(h,bs*.7,L+3),fg:hsl(h,20,rnd(86,92)),mu:hsl(h,12,rnd(58,66)),
       hv:hsl(h,bs*.8,L+10),sel:hsl(ah,as-15,rnd(26,32)),selfg:hsl(ah,40,rnd(94,98)),
       bar:hsl(h,bs*.9,L+12),drop:hsl(ah,as-10,rnd(30,36)),ac:hsl(ah,as,rnd(52,62)),acfg:hsl(h,30,8),
       bd:hsl(h,bs*.6,L+11),sb:hsl(h,bs*.6,L+22),hdbg:hsl(h,bs*.7,L+5),btnhv:hsl(h,bs*.8,L+16)};
  }
  c.canvas=c.bg;
  c._meta=`${mode==='light'?'浅':'深'} · H${Math.round(h)} · ${{comp:'互补',ana:'邻近',tri:'三角',mono:'同色'}[rel]}`;
  return c;
}

function setVars(pv,s){KEYS.forEach(k=>pv.style.setProperty('--'+k,'#'+s[k]))}

const ROWS=[['📁','.obsidian','4 项',0],['','04-含代码块.md','601 B',601],['','05-特殊标题.md','734 B',734],['','03-扁平结构.md','155 B',155],['','02-深层嵌套.md','385 B',385],['','01-完整层级.md','409 B',409]];
function buildPV(s,interactive,showDrop){
  const pv=document.createElement('div');pv.className='pv';
  pv.innerHTML=`<div class="hd"><span class="b">名称</span><span class="b">大小</span><span class="b ac">日期 ▾</span><span class="b" style="padding:2px 8px">↻</span><span class="sp"></span><span class="ic">◧</span><span class="ic">▭</span></div>
  <div class="tt">test_outline<i>✎</i></div>
  <div class="list">${ROWS.map((r,i)=>{
    const cls=['row'];if(i===4)cls.push('sel');if(i===3)cls.push('hov');if(i===0&&showDrop)cls.push('drop');
    const bar=r[3]?`<span class="bar" style="width:${Math.round(r[3]/734*45)}%"></span>`:'';
    return `<div class="${cls.join(' ')}">${bar}<span>${r[0]||'📄'}</span><span class="nm">${r[1]}</span><span class="sz">${r[2]}</span></div>`}).join('')}</div>
  <div class="ft">6 项</div>`;
  setVars(pv,s);
  if(interactive){
    pv.querySelector('.list').addEventListener('click',e=>{
      const row=e.target.closest('.row');if(!row)return;
      pv.querySelectorAll('.row.sel').forEach(x=>x.classList.remove('sel'));row.classList.add('sel');
    });
  }
  return pv;
}

let cur=gen({hueRand:true,mode:'light',rel:'rand'});
let batch=[];

function toText(s){return KEYS.map(k=>k+'='+s[k]).join('\n')}

function renderMain(){
  const box=$('mainPv');box.innerHTML='';box.appendChild(buildPV(cur,true,$('showDrop').checked));
  const ed=$('editor');ed.innerHTML='';
  KEYS.forEach(k=>{
    const lb=document.createElement('span');lb.innerHTML=`${k}<small>${LABEL[k]}</small>`;
    const cp=document.createElement('input');cp.type='color';cp.value='#'+cur[k];
    const tx=document.createElement('input');tx.type='text';tx.value=cur[k];tx.maxLength=6;
    cp.oninput=()=>{set(k,cp.value.slice(1).toUpperCase());tx.value=cur[k]};
    tx.oninput=()=>{if(/^[0-9a-fA-F]{6}$/.test(tx.value)){set(k,tx.value.toUpperCase());cp.value='#'+cur[k]}};
    ed.append(lb,cp,tx);
  });
  $('out').value=toText(cur);
}
function set(k,v){
  cur[k]=v;
  const pv=$('mainPv').firstChild;pv.style.setProperty('--'+k,'#'+v);
  $('out').value=toText(cur);
}

function opts(){return{mode:$('mode').value,rel:$('rel').value,hueRand:$('hueRand').checked,hue:+$('hue').value}}

function renderCards(){
  const c=$('cards');c.innerHTML='';
  batch.forEach(s=>{
    const d=document.createElement('div');d.className='card';
    const w=document.createElement('div');w.className='pvbox';w.appendChild(buildPV(s,false,false));
    const cap=document.createElement('div');cap.className='cap';
    cap.innerHTML=`<span>${s._meta}</span>`;
    const b=document.createElement('button');b.textContent='复制';
    b.onclick=e=>{e.stopPropagation();copy(toText(s),b)};
    cap.appendChild(b);d.append(w,cap);
    d.onclick=()=>{cur=Object.assign({},s);renderMain();window.scrollTo({top:0,behavior:'smooth'})};
    c.appendChild(d);
  });
}

function copy(t,btn){
  const done=()=>{if(!btn)return;const o=btn.textContent;btn.textContent='已复制';setTimeout(()=>btn.textContent=o,900)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fb())}else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}

$('go').onclick=()=>{
  const n=Math.max(1,Math.min(60,+$('cnt').value||12));
  batch=Array.from({length:n},()=>gen(opts()));
  cur=Object.assign({},batch[0]);
  renderMain();renderCards();
};
$('copyAll').onclick=e=>{
  if(!batch.length)return;
  copy(batch.map(toText).join('\n\n'),e.target);
};
$('copyOne').onclick=e=>copy($('out').value,e.target);
$('hueRand').onchange=()=>{$('hue').disabled=$('hueRand').checked};
$('hue').oninput=()=>$('hueV').textContent=$('hue').value;
$('showDrop').onchange=renderMain;
$('out').oninput=()=>{
  let changed=false;
  $('out').value.split(/\r?\n/).forEach(l=>{
    const m=l.trim().match(/^(\w+)=#?([0-9a-fA-F]{6})$/);
    if(m&&KEYS.includes(m[1])){cur[m[1]]=m[2].toUpperCase();changed=true}
  });
  if(changed){
    const t=$('out').value;renderMain();$('out').value=t;
  }
};

$('go').click();
</script>
</body>
</html>
